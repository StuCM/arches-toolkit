{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "arches.fullname" . }}
  labels:
    {{- include "arches.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled" .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.static.enabled }}
          # /static/ bypasses gunicorn entirely (docs/k8s-deployment.md).
          - path: {{ .Values.ingress.staticPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "arches.fullname" . }}-static
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "arches.fullname" . }}-web
                port:
                  name: http
{{- end }}
