apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devservices.fullname" . }}-rabbitmq
  labels:
    {{- include "devservices.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.rabbitmq.password | quote }}
  # Assembled URL for the arches chart's rabbitmq.existingSecret.
  rabbitmq-url: {{ printf "amqp://%s:%s@%s-rabbitmq:5672//" .Values.rabbitmq.username .Values.rabbitmq.password (include "devservices.fullname" .) | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devservices.fullname" . }}-rabbitmq
  labels:
    {{- include "devservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: {{ .Values.rabbitmq.username | quote }}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "devservices.fullname" . }}-rabbitmq
                  key: password
          ports:
            - name: amqp
              containerPort: 5672
            - name: mgmt
              containerPort: 15672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 30
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devservices.fullname" . }}-rabbitmq
  labels:
    {{- include "devservices.labels" . | nindent 4 }}
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: mgmt
      port: 15672
      targetPort: mgmt
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rabbitmq
