# Images and env mirror cli/src/arches_toolkit/_data/compose.yaml — that
# file is the canonical contract for the infrastructure layer.

postgres:
  image: postgis/postgis:16-3.4
  user: postgres
  password: postgres
  database: arches
  storage: 5Gi
  storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

elasticsearch:
  image: elasticsearch:8.4.0
  javaOpts: "-Xms512m -Xmx512m"
  storage: 5Gi
  storageClass: ""
  resources:
    requests:
      cpu: 250m
      # JVM: request = limit (docs/k8s-deployment.md, sizing).
      memory: 1.5Gi
    limits:
      memory: 1.5Gi

rabbitmq:
  image: rabbitmq:3-management
  username: arches
  password: arches
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
