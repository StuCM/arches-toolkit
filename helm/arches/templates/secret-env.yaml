{{/*
Chart-managed secret material. Only rendered for values the chart has to
assemble itself; production supplies existingSecret* references (SOPS
pipeline) and this shrinks to nothing.
*/}}
{{- $needsPg := not .Values.postgres.existingSecret }}
{{- $needsMq := not .Values.rabbitmq.existingSecret }}
{{- if or $needsPg $needsMq .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arches.fullname" . }}-env
  labels:
    {{- include "arches.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsPg }}
  pg-password: {{ required "postgres.password or postgres.existingSecret is required" .Values.postgres.password | quote }}
  {{- end }}
  {{- if $needsMq }}
  {{- if .Values.rabbitmq.url }}
  rabbitmq-url: {{ .Values.rabbitmq.url | quote }}
  {{- else }}
  rabbitmq-url: {{ printf "amqp://%s:%s@%s:%v/%s" .Values.rabbitmq.username .Values.rabbitmq.password (required "rabbitmq.host (or .url / .existingSecret) is required" .Values.rabbitmq.host) .Values.rabbitmq.port (trimPrefix "/" .Values.rabbitmq.vhost) | quote }}
  {{- end }}
  {{- end }}
  {{- if and (not .Values.existingSecretEnv) .Values.secretEnv }}
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
