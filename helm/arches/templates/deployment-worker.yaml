apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arches.fullname" . }}-worker
  labels:
    {{- include "arches.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "arches.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "arches.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "arches.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with include "arches.frontendConfigInitContainer" . }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "arches.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # Recycling flags keep pod memory deterministic so the limit can
          # sit close to the request (docs/k8s-deployment.md, sizing).
          command:
            - celery
            - -A
            - {{ include "arches.celeryApp" . }}
            - worker
            - -l
            - {{ .Values.worker.celery.logLevel }}
            - --concurrency
            - {{ .Values.worker.celery.concurrency | quote }}
            {{- if .Values.worker.celery.maxTasksPerChild }}
            - --max-tasks-per-child
            - {{ .Values.worker.celery.maxTasksPerChild | quote }}
            {{- end }}
            {{- if .Values.worker.celery.maxMemoryPerChild }}
            - --max-memory-per-child
            - {{ .Values.worker.celery.maxMemoryPerChild | quote }}
            {{- end }}
          env:
            {{- include "arches.env" . | nindent 12 }}
          envFrom:
            {{- include "arches.envFrom" . | nindent 12 }}
          volumeMounts:
            {{- include "arches.volumeMounts" . | nindent 12 }}
          {{- if .Values.worker.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A {{ include "arches.celeryApp" . }} inspect ping -d celery@$HOSTNAME --timeout 10
            initialDelaySeconds: 60
            periodSeconds: {{ .Values.worker.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.livenessProbe.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "arches.volumes" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
