name: chart-lint

on:
  push:
    branches: [main]
    paths:
      - "cli/src/arches_toolkit/_data/helm/**"
      - ".github/workflows/chart-lint.yml"
  pull_request:
    paths:
      - "cli/src/arches_toolkit/_data/helm/**"
      - ".github/workflows/chart-lint.yml"

env:
  CHART: cli/src/arches_toolkit/_data/helm/arches
  DEV_SERVICES: cli/src/arches_toolkit/_data/helm/arches-dev-services

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: helm lint
        run: |
          helm lint "$CHART" -f "$CHART/ci/test-values.yaml"
          helm lint "$DEV_SERVICES"

      - name: helm template (default topology)
        run: |
          helm template test "$CHART" -f "$CHART/ci/test-values.yaml" > /dev/null
          helm template svc "$DEV_SERVICES" > /dev/null

      - name: helm template (dev profile — what `deploy dev` installs)
        run: |
          helm template dev "$CHART" \
            -f "$CHART/values-dev.yaml" \
            --set project.package=smoke \
            --set image.repository=ghcr.io/example/smoke --set image.tag=main-1 \
            --set postgres.host=pg --set postgres.existingSecret=pg-secret \
            --set elasticsearch.host=es \
            --set rabbitmq.existingSecret=mq-secret \
            > /dev/null

      - name: helm template (prod profile — existing secrets, no fallbacks)
        run: |
          helm template prod "$CHART" \
            --set project.package=smoke \
            --set image.repository=ghcr.io/example/smoke --set image.tag=v0.0.1 \
            --set postgres.host=pg --set postgres.existingSecret=pg-secret \
            --set elasticsearch.host=es \
            --set rabbitmq.existingSecret=mq-secret \
            --set existingSecretEnv=env-secret \
            --set frontendConfiguration.generateAtBoot=false \
            --set uploads.persistence.existingClaim=uploads \
            > /dev/null
