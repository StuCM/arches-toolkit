name: chart-lint

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/chart-lint.yml"
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/chart-lint.yml"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: helm lint
        run: helm lint helm/arches -f helm/arches/ci/test-values.yaml

      - name: helm template (default topology)
        run: helm template test helm/arches -f helm/arches/ci/test-values.yaml > /dev/null

      - name: helm template (prod profile — existing secrets, no fallbacks)
        run: |
          helm template prod helm/arches \
            --set project.package=smoke \
            --set image.repository=ghcr.io/example/smoke --set image.tag=v0.0.1 \
            --set postgres.host=pg --set postgres.existingSecret=pg-secret \
            --set elasticsearch.host=es \
            --set rabbitmq.existingSecret=mq-secret \
            --set existingSecretEnv=env-secret \
            --set frontendConfiguration.generateAtBoot=false \
            --set uploads.persistence.existingClaim=uploads \
            > /dev/null
