name: project-release

# Reusable release workflow for Arches projects: on a semver tag push,
# publishes `prod` + `nginx` images tagged with that version. Production
# HelmReleases pin these tags; promotion is a reviewed values bump in the
# fluxcd repo (docs/k8s-deployment.md, environments and promotion).
#
#   on:
#     push:
#       tags: ["v*.*.*"]
#   jobs:
#     release:
#       uses: flaxandteal/arches-toolkit/.github/workflows/project-release.yml@v1
#       permissions:
#         contents: read
#         packages: write
#       with:
#         project_name: myproject

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      project_package:
        required: false
        default: ""
        type: string
      image_name:
        required: false
        default: ""
        type: string
      toolkit_ref:
        required: false
        default: "main"
        type: string
      arches_toolkit_image:
        required: false
        default: "ghcr.io/flaxandteal/arches-toolkit"
        type: string
      arches_toolkit_tag:
        required: false
        default: "latest-arches-stable-8.1.2"
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Require a tag ref
        if: github.ref_type != 'tag'
        run: |
          echo "project-release.yml must be called from a tag push (got ${{ github.ref }})" >&2
          exit 1

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout toolkit (packaged Dockerfile)
        uses: actions/checkout@v4
        with:
          repository: flaxandteal/arches-toolkit
          ref: ${{ inputs.toolkit_ref }}
          path: .arches-toolkit

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image refs
        id: refs
        run: |
          set -euo pipefail
          image='${{ inputs.image_name }}'
          if [ -z "$image" ]; then
            image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          fi
          version='${{ github.ref_name }}'
          {
            echo "app_tag=${image}:${version}"
            echo "static_tag=${image}-static:${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .arches-toolkit/cli/src/arches_toolkit/_data/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.refs.outputs.app_tag }}
          build-args: |
            ARCHES_TOOLKIT_IMAGE=${{ inputs.arches_toolkit_image }}
            ARCHES_TOOLKIT_TAG=${{ inputs.arches_toolkit_tag }}
            PROJECT_NAME=${{ inputs.project_name }}
            PROJECT_PACKAGE=${{ inputs.project_package || inputs.project_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push static (nginx) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .arches-toolkit/cli/src/arches_toolkit/_data/Dockerfile
          target: nginx
          push: true
          tags: ${{ steps.refs.outputs.static_tag }}
          build-args: |
            ARCHES_TOOLKIT_IMAGE=${{ inputs.arches_toolkit_image }}
            ARCHES_TOOLKIT_TAG=${{ inputs.arches_toolkit_tag }}
            PROJECT_NAME=${{ inputs.project_name }}
            PROJECT_PACKAGE=${{ inputs.project_package || inputs.project_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
